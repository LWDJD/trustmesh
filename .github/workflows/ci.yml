name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # 刻意**不**设 RUSTFLAGS: -D warnings ——
  # 它会把所有 rustc 警告升级成错误，而本仓有两处**明确豁免**：
  #   1) crates/exp 的 21 个一次性实验 bin（约 46 条历史警告，改它们属于「重跑实验的人」的活）
  #   2) 根 v1.0 遗留代码（作者要求原样保留，不参与新架构）
  # 严格标准由 lint job 的 `-- -D warnings` 逐 crate 施加，与本地 verify-all.ps1 的口径一致。

jobs:
  # ============================================================
  # 变更分类：只有文档改动时，跳过全部重活。
  # 
  # 这一项**永远运行**（不依赖任何 needs），因此它可以作为分支保护的必需检查：
  # 文档 PR 上 heavy job 全部 skip，但这一项仍给出明确的 success。
  # 
  # 为什么不用工作流级的 `paths-ignore`：那样文档 PR 根本不会产生任何 check，
  # 若分支保护要求「必须通过某些 check」，PR 会被**永久卡住**无法合并。
  # ============================================================
  changes:
    name: change scope
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
      files: ${{ steps.classify.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史才能算 base...head 的差异
      - id: classify
        name: classify changed paths
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          case "$BASE" in
            ''|0000000000000000000000000000000000000000)
              # 新分支/首次推送没有 before，保守起见按「有代码改动」处理
              echo "base unknown (new branch) -> run full CI"
              echo 'code=true' >> "$GITHUB_OUTPUT"
              echo 'files=(unknown base)' >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          CHANGED=$(git diff --name-only "$BASE...HEAD" || true)
          if [ -z "$CHANGED" ]; then
            echo "no path changes detected -> run full CI (safe default)"
            echo 'code=true' >> "$GITHUB_OUTPUT"
            echo 'files=(none)' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CODE=false
          DOC_ONLY=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|LICENSE|LICENSE.*|.gitignore|.gitattributes)
                continue ;;
            esac
            # 任何一个非文档路径都意味着要跑完整 CI
            DOC_ONLY=false
            CODE=true
            break
          done <<EOF
          $CHANGED
          EOF
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          FILES_ONE_LINE=$(printf '%s ' $CHANGED)
          echo "files=$FILES_ONE_LINE" >> "$GITHUB_OUTPUT"
          echo "--- changed files ---"
          echo "$CHANGED"
          echo "doc_only=$DOC_ONLY  run_full_ci=$CODE"

  # ============================================================
  # 四个独立 workspace 各自跑测试（store / view / agg 已于 2026-11-21 并入 engine）。
  # **不能**在根目录跑 `cargo test` 了事 —— 它们各自是自己的 workspace 根。
  # ============================================================
  test:
    name: test / ${{ matrix.crate }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [engine, sim, exp, mincore]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - name: cargo test
        working-directory: crates/${{ matrix.crate }}
        run: cargo test --all-targets

# 根包的 v1.0 遗留代码单独测（作者要求保留，不参与新架构）
  test-legacy:
    name: test / trustmesh (v1.0)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - run: cargo test --all-targets

  # ============================================================
  # 文档测试：README 与 crate 文档里的代码必须**真的能跑**。
  # 注意：这里只排除「纯 .md 改动」，**不**排除文档测试本身 ——
  # 因为 crate 里的 doc comment 改动属于代码路径（.rs 文件），会触发 code=true。
  # ============================================================
  doctest:
    name: doc tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [engine, sim, mincore]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - name: cargo test --doc
        working-directory: crates/${{ matrix.crate }}
        run: cargo test --doc

  # ============================================================
  # clippy + fmt：风格与 lint 门禁。
  # ============================================================
  lint:
    name: lint / ${{ matrix.crate }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: [engine, sim, exp, mincore]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
      - name: cargo fmt --check
        working-directory: crates/${{ matrix.crate }}
        run: cargo fmt --check
      - name: cargo clippy
        working-directory: crates/${{ matrix.crate }}
        # exp 有 21 个一次性实验 bin（约 46 条历史警告），本地 verify-all.ps1 对它们
        # 只卡 lib + 两个集成测试；CI 必须与本地口径一致，否则「本地绿、CI 红」。
        run: |
          if [ "${{ matrix.crate }}" = "exp" ]; then
            cargo clippy --lib --test runtime --test parity -- -D warnings
          else
            cargo clippy --all-targets -- -D warnings
          fi

  # ============================================================
  # 跨平台逐位一致：这是本库**最值钱的性质**，必须每次代码改动都验证。
  # native x86_64 与 wasm32 必须给出逐位相同的 f32 位模式。
  # ============================================================
  wasm-parity:
    name: wasm32 bit-parity
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: build wasm32 (lib → .wasm)
        working-directory: tools/wasm-smoke
        run: cargo build --release --lib --target wasm32-unknown-unknown
      - name: build native (bin)
        working-directory: tools/wasm-smoke
        run: cargo build --release --bin tm_wasm_smoke_cli
      - name: run native and dump
        working-directory: tools/wasm-smoke
        run: ./target/release/tm_wasm_smoke_cli > native.txt
      - name: compare wasm32 vs native
        working-directory: tools/wasm-smoke
        run: node run-compare.mjs native.txt

      # ---------- mincore 的第二套对拍（2739 个 f32 位模式 + 12 张定长编码快照） ----------
      - name: build wasm32 (mincore lib → .wasm)
        working-directory: tools/mincore-wasm
        run: cargo build --release --lib --target wasm32-unknown-unknown
      - name: build native (mincore bin)
        working-directory: tools/mincore-wasm
        run: cargo build --release --bin mc_wasm_cli
      - name: golden standard freshness (committed native.txt must match a real run)
        working-directory: tools/mincore-wasm
        run: |
          set -eu
          ./target/release/mc_wasm_cli > /tmp/native_now.txt
          if ! cmp -s native.txt /tmp/native_now.txt; then
            echo '::error file=tools/mincore-wasm/native.txt::golden file is stale — regenerate with: ./target/release/mc_wasm_cli > native.txt'
            diff <(head -c 2000 native.txt) <(head -c 2000 /tmp/native_now.txt) || true
            exit 1
          fi
          echo 'golden native.txt is fresh'
      - name: determinism self-check (run native twice, must be byte-identical)
        working-directory: tools/mincore-wasm
        run: |
          set -eu
          ./target/release/mc_wasm_cli > /tmp/native_a.txt
          ./target/release/mc_wasm_cli > /tmp/native_b.txt
          cmp /tmp/native_a.txt /tmp/native_b.txt
          echo 'native is deterministic across runs'
      - name: compare wasm32 vs native (mincore)
        working-directory: tools/mincore-wasm
        run: node run-compare.mjs native.txt

  # ============================================================
  # 零依赖守卫：本库刻意保持零外部依赖（供应链攻击面最小化）。
  # 这一项**不**受 changes 门控 —— 它只看 Cargo.toml，成本 2 秒，
  # 而且是最该在每次推送都守住的纪律。
  # ============================================================
  no-external-deps:
    name: zero-dependency guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: assert no registry dependencies
        run: |
          set -eu
          fail=0
          for f in crates/*/Cargo.toml Cargo.toml tools/*/Cargo.toml; do
            [ -f "$f" ] || continue
            in_deps=0
            while IFS= read -r line; do
              case "$line" in
                *"[dependencies]") in_deps=1; continue ;;
                *"["*)            in_deps=0; continue ;;
              esac
              if [ "$in_deps" = 1 ]; then
                trimmed=$(printf '%s' "$line" | sed 's/[[:space:]]*$//' | sed 's/^[[:space:]]*//')
                case "$trimmed" in
                  ''|'#'*) continue ;;
                esac
                case "$trimmed" in
                  *"path = "*) continue ;;
                esac
                echo "::error file=$f::EXTERNAL dependency: $trimmed"
                fail=1
              fi
            done < "$f"
          done
          if [ "$fail" -eq 0 ]; then
            echo "OK: zero external dependencies (all deps are in-repo path deps)"
          fi
          exit $fail
