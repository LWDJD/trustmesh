[package]
name = "trustmesh"
version = "0.1.0"
edition = "2021"
description = "Lightweight decentralized trust: personalized propagation, rating-weighted sampling, and sybil resistance"
license = "MIT"
repository = "https://github.com/LWDJD/trustmesh"
homepage = "https://github.com/LWDJD/trustmesh"
keywords = ["p2p", "trust", "sybil", "decentralized", "reputation"]
categories = ["network-programming", "algorithms"]
readme = "README.md"

[lib]
name = "trustmesh"
path = "src/lib.rs"

[[bin]]
name = "simulate"
path = "src/bin/simulate.rs"

[[bin]]
name = "attack_report"
path = "src/bin/attack_sim.rs"

[[bin]]
name = "scope_report"
path = "src/bin/scope_report.rs"

[[bin]]
name = "sketch_report"
path = "src/bin/sketch_report.rs"

[[bin]]
name = "fullsim"
path = "src/bin/fullsim.rs"

[[bin]]
name = "merge_report"
path = "src/bin/merge_report.rs"

[[bin]]
name = "large_scale"
path = "src/bin/large_scale.rs"

[[bin]]
name = "baseline_compare"
path = "src/bin/baseline_compare.rs"

[[bin]]
name = "neg_attack"
path = "src/bin/neg_attack.rs"

[[bin]]
name = "vouch"
path = "src/bin/vouch.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
