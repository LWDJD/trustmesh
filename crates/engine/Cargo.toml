[package]
name = "tm_engine"
version = "0.1.0"
edition = "2021"
description = "trustmesh 引擎：把存储层、压缩观点、衰减聚合拼成完整运行时"
license = "MIT"

# 独立 workspace 根，避免被上层目录误判
[workspace]

[dependencies]
# 零外部依赖：原 tm_store / tm_view / tm_agg 已于 2026-11-21 合并进本 crate 的
# store / view / agg 三个模块，所以这里不再需要 path 依赖。

[profile.release]
opt-level = 3
lto = true
