[package]
name = "tm_store"
version = "0.1.0"
edition = "2021"
description = "trustmesh 存储层：账户表、正分清单与轮次抽样器"
license = "MIT"

# 显式声明本目录是独立的 workspace 根，
# 避免被上层 trustmesh 包的目录结构误判为某个 workspace 的成员。
#
# 注意：本 crate 现在是**兼容层空壳**，内容已合并进 tm_engine。
[workspace]

[dependencies]
# 兼容层：内容已合并进 tm_engine
tm_engine = { path = "../engine" }

[profile.release]
opt-level = 3
lto = true
